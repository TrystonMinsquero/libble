<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Libble - Quote Guessing Game</title>
		<link rel="icon" type="image/x-icon" href="favicon.ico">
		<link rel="stylesheet"
		      href="css/style.css"
		>
		<script src="js/wasm_exec.js"></script>
		<script>
			const go = new Go();
			WebAssembly.instantiateStreaming(fetch("js/main.wasm"), go.importObject).then((result) => {
				go.run(result.instance);
				});
		</script>
	</head>
	<body>
		<div class="container">
			<h1>📖 Libble</h1>
			<p class="subtitle">Guess the book from a quote</p>

			<div class="quote-box" id="quoteBox">
				<p id="quote">"Selecting your quote for the day..."</p>
			</div>

			<div class="hints-section" id="hintSection" disabled>
				<button type="button" class="hint-btn game-input" id="timeHintBtn" disabled title="Show when you last read this book">🕗</button>
				<!-- <button type="button" class="hint-btn game-input" id="authorInitialBtn" disabled title="Show the author's initals">👩</button> -->
				<!-- <button type="button" class="hint-btn" id="hintBtn2" disabled>💡 Hint 2</button> -->
				<!-- <button type="button" class="hint-btn" id="hintBtn3" disabled>💡 Hint 3</button> -->
				<button type="button" id="skipBtn" class="hint-btn game-input" disabled title="Skip this quote (only available before making a guess)">⏭️</button>
			</div>

			<div class="feedback" id="feedbackBox"></div>

			<form id="guessForm">
				<div class="input-row">
					<div class="input-group">
						<div class="label-row">
							<label for="title">Book Title:</label>
							<span id="gameProgress" class="game-progress"></span>
						</div>
						<input type="text"
						       id="title"
						       name="title"
						       placeholder="Start typing to see your list of books"
						       class="game-input"
						       required
						       disabled
						       autocomplete="off"
						>
						<ul id="titleSuggestions" class="suggestions"></ul>
					</div>

					<button type="submit" id="submitBtn" class="submit-btn game-input" disabled>Submit Guess</button>
				</div>
			</form>


			<div class="share-container" id="shareContainer" style="display: none; margin-top: 20px; text-align: center;">
				<button type="button" id="shareBtn" class="share-btn">📋 Share Results</button>
			</div>
		</div>
	</body>
</html>
