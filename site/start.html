<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Libble - Get Started</title>
		<link rel="icon" type="image/x-icon" href="favicon.ico">
		<link rel="stylesheet"
		      href="css/style.css"
		>
		<script src="js/wasm_exec.js"></script>
		<script>
			const go = new Go();
			WebAssembly.instantiateStreaming(fetch("js/main.wasm"), go.importObject).then((result) => {
				go.run(result.instance);
				});
		</script>
	</head>
	<body>
		<!-- User Icon - Fixed position in top right -->
		<div class="user-icon-container" hidden>
			<button id="userIconBtn" class="user-icon-btn" title="Account Settings">
				👤
			</button>
		</div>

		<div class="landing-container">
			<h1>📖 Libble</h1>
			<p class="description">
				Guess the book and author from quotes from your Goodreads library!
			</p>

			<form id="goodreads-user-form" class="goodreads-form">
				<label for="userId">Enter your Goodreads User ID:</label>
				<input type="text"
				       id="userId"
				       name="userId"
				       placeholder="e.g., 12345678"
				       required
				       title="Please enter a valid numeric Goodreads User ID"
				>
				<button id="submit-button" type="submit">Start Playing</button>
				<div id="status-message" class="status-message" hidden></div>
				<div id="progress-container" class="progress-container" hidden>
					<div class="progress-bar">
						<div id="progress-fill" class="progress-fill"></div>
					</div>
					<div id="progress-text" class="progress-text"></div>
				</div>
			</form>

			<div class="help-text">
				<p>Don't know your User ID?</p>
				<a href="https://www.goodreads.com/" target="_blank">
					Find it on your Goodreads profile page in your browser
				</a>
				<p>Your User ID is the number in your profile URL: goodreads.com/user/show/<strong>12345678</strong></p>
			</div>
		</div>

		<!-- Settings Modal -->
		<div id="settingsModal" class="modal" hidden>
			<div class="modal-content">
				<button class="modal-close" id="closeModalBtn">✖</button>
				<h2>Account Settings</h2>

				<div id="settingsContent">
					<!-- Populated by WASM based on auth state -->
				</div>
			</div>
		</div>

		<!-- <script src="js/start.js"></script> -->
	</body>
</html>
